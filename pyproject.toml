[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agentic-os-control-plane"
version = "0.2.0"
description = "Governed execution layer for workflow automation. Policy, approval, and audit on every action."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Nicholas Hidalgo" }]
keywords = ["workflow-governance", "control-plane", "policy", "audit", "approvals"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "typer>=0.12",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
agentic-os = "agentic_os.cli:app"
aos = "agentic_os.cli:app"

[project.urls]
Homepage = "https://github.com/nicholashidalgo/agentic-os-control-plane"
Repository = "https://github.com/nicholashidalgo/agentic-os-control-plane"
Issues = "https://github.com/nicholashidalgo/agentic-os-control-plane/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_os"]

[tool.hatch.build.targets.sdist]
include = [
  "src/agentic_os",
  "config.example.yaml",
  "skills",
  "README.md",
  "LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
